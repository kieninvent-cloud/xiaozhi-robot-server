name: Keep Render Server Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API
        run: |
          curl -fsS --max-time 30 -H "User-Agent: GitHubKeepAlive/1.0" https://xiaozhi-robot-server.onrender.com/api/status || true
