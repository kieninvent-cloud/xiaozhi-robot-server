server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: wss://__PUBLIC_HOST__/xiaozhi/v1/
  vision_explain: https://__PUBLIC_HOST__/mcp/vision/explain
  timezone_offset: +7
  auth:
    enabled: false

log:
  log_level: INFO
  log_dir: tmp
  log_file: "server.log"
  data_dir: data

delete_audio: true
close_connection_no_voice_time: 120
tts_timeout: 20
tool_call_timeout: 45
enable_wakeup_words_response_cache: false
enable_greeting: true
enable_stop_tts_notify: false

exit_commands:
  - "tạm biệt"
  - "thoát"
  - "tắt đi"
  - "ngủ đi"
  - "退出"

prompt: |
  Bạn là trợ lý robot AI siêu thông minh, nhạy bén, thân thiện và hài hước, giao tiếp hoàn toàn bằng Tiếng Việt tự nhiên.
  Quy tắc bắt buộc:
  - Luôn mở đầu bằng một câu ngắn gọn dưới 12 từ kết thúc bằng dấu chấm để robot phát âm thanh phản hồi tức thì dưới 1 giây, sau đó giải thích đầy đủ, chính xác, thông minh trong 1-2 câu tiếp theo.
  - CHỈ trả lời trực tiếp bằng Tiếng Việt có dấu. TUYỆT ĐỐI KHÔNG viết suy nghĩ nội bộ, không viết thẻ <think>, không dùng tiếng Trung hay tiếng Anh, không dùng ký hiệu markdown như ** hoặc ###.
  - Khi người dùng yêu cầu mở nhạc, phát bài hát bất kỳ, hãy gọi ngay công cụ `play_music` với `song_name` là tên bài hát chuẩn tiếng Việt (kèm ca sĩ nếu biết).
  - Khi người dùng yêu cầu robot di chuyển (tiến lên, lùi lại, rẽ trái/xoay ngược chiều kim đồng hồ, rẽ phải/xoay theo chiều kim đồng hồ, dừng lại), hãy gọi ngay công cụ `self.motor.drive`.
  - Khi người dùng yêu cầu bật đèn hoặc tắt đèn LED, hãy gọi ngay công cụ `self.lamp.turn_on` hoặc `self.lamp.turn_off`.

system_error_response: "Xin lỗi bạn, mình đang gặp chút trục trặc kết nối, bạn nói lại giúp mình nhé."

end_prompt:
  enable: false

selected_module:
  VAD: SileroVAD
  ASR: GroqASR
  LLM: GroqLLM
  VLLM: GroqLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 350

Intent:
  function_call:
    type: function_call
    functions:
      - play_music

Memory:
  nomem:
    type: nomem
  mem_local_short:
    type: mem_local_short
    llm: GroqLLM

ASR:
  GroqASR:
    type: openai
    api_key: __GROQ_API_KEY__
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    language: vi
    output_dir: tmp/

LLM:
  GroqLLM:
    type: openai
    base_url: https://api.groq.com/openai/v1
    model_name: openai/gpt-oss-20b
    api_key: __GROQ_API_KEY__
    temperature: 0.6
    max_tokens: 300
    top_p: 1
    frequency_penalty: 0.2

TTS:
  EdgeTTS:
    type: edge
    voice: vi-VN-HoaiMyNeural
    output_dir: tmp/
    language: "Tiếng Việt"

plugins:
  play_music:
    music_dir: "./music"
    music_ext:
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 60
