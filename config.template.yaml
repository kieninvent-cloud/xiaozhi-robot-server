server:
  ip: 0.0.0.0
  port: 8000
  http_port: 8003
  websocket: wss://__PUBLIC_HOST__/xiaozhi/v1/
  vision_explain: https://__PUBLIC_HOST__/mcp/vision/explain
  timezone_offset: +7
  auth:
    enabled: false

log:
  log_level: INFO
  log_dir: tmp
  log_file: "server.log"
  data_dir: data

delete_audio: true
close_connection_no_voice_time: 86400
tts_timeout: 20
tool_call_timeout: 45
enable_wakeup_words_response_cache: false
enable_greeting: true
enable_stop_tts_notify: false

exit_commands:
  - "tạm biệt"
  - "thoát"
  - "tắt đi"
  - "ngủ đi"
  - "退出"

prompt: |
  Bạn là trợ lý robot AI siêu thông minh, hóm hỉnh, thân thiện và hiểu biết sâu rộng, giao tiếp hoàn toàn bằng Tiếng Việt tự nhiên.
  Quy tắc bắt buộc:
  - Luôn mở đầu bằng một câu ngắn gọn dưới 12 từ kết thúc bằng dấu chấm để robot phát âm thanh phản hồi tức thì dưới 1 giây, sau đó trả lời đầy đủ, chính xác, thông minh trong 1-3 câu tiếp theo.
  - Với các câu hỏi đùa vui đời thường (ví dụ "con vợ kêu như nào", câu đố vui, tán gẫu), hãy trả lời thật hài hước, dí dỏm, tự nhiên như một người bạn; TUYỆT ĐỐI KHÔNG từ chối kiểu "Xin lỗi, tôi không thể trả lời câu hỏi đó".
  - Khi đọc công thức toán học (như 7 hằng đẳng thức đáng nhớ), hãy diễn đạt bằng lời tiếng Việt dễ nghe (ví dụ: "bình phương của một tổng bằng a bình cộng hai a b cộng b bình"). Khi đọc dãy số dài (như số Pi), viết rõ từng chữ số cách nhau bằng khoảng trắng hoặc viết số bình thường, TUYỆT ĐỐI không dùng chữ tiếng Trung hay tiếng Anh.
  - Khi người dùng hỏi thời tiết, hãy gọi ngay công cụ `get_weather`.
  - Khi người dùng hỏi giá xăng dầu hôm nay, giá vàng, tỷ giá hoặc tin tức thời sự mới nhất, hãy gọi ngay công cụ `web_search`.
  - Khi người dùng yêu cầu mở nhạc, phát bài hát bất kỳ, hãy gọi ngay công cụ `play_music` với `song_name` là tên bài hát chuẩn tiếng Việt (kèm ca sĩ nếu biết).
  - Khi người dùng yêu cầu bật hoặc tắt chế độ tự hành (hoặc tự đi tuần tra, tự di chuyển tránh vật cản/chống rơi), hãy gọi ngay công cụ `self.autonomous.set_mode` với `enable: true` (bật) hoặc `enable: false` (tắt).
  - Khi người dùng yêu cầu robot di chuyển (tiến lên, lùi lại, rẽ trái, rẽ phải, dừng lại), hãy gọi ngay công cụ `self.motor.drive`.
  - Khi người dùng yêu cầu bật đèn hoặc tắt đèn LED, hãy gọi ngay công cụ `self.lamp.turn_on` hoặc `self.lamp.turn_off`.
  - CHỈ trả lời bằng Tiếng Việt có dấu, văn bản thuần, không dùng ký hiệu markdown như ** hoặc ###.

system_error_response: "Xin lỗi bạn, mình đang gặp chút trục trặc kết nối, bạn nói lại giúp mình nhé."

end_prompt:
  enable: false

selected_module:
  VAD: SileroVAD
  ASR: GroqASR
  LLM: GroqLLM
  VLLM: GroqLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

VAD:
  SileroVAD:
    type: silero
    threshold: 0.5
    threshold_low: 0.3
    model_dir: models/snakers4_silero-vad
    min_silence_duration_ms: 350

Intent:
  function_call:
    type: function_call
    functions:
      - play_music
      - get_weather
      - web_search

Memory:
  nomem:
    type: nomem
  mem_local_short:
    type: mem_local_short
    llm: GroqLLM

ASR:
  GroqASR:
    type: openai
    api_key: __GROQ_API_KEY__
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    language: vi
    output_dir: tmp/

LLM:
  GroqLLM:
    type: openai
    base_url: https://api.groq.com/openai/v1
    model_name: qwen/qwen3.8-27b
    api_key: __GROQ_API_KEY__
    temperature: 0.6
    max_tokens: 350
    top_p: 0.9
    frequency_penalty: 0.0

TTS:
  EdgeTTS:
    type: edge
    voice: vi-VN-HoaiMyNeural
    output_dir: tmp/
    language: "Tiếng Việt"

plugins:
  play_music:
    music_dir: "./music"
    music_ext:
      - ".mp3"
      - ".wav"
      - ".p3"
    refresh_time: 60
